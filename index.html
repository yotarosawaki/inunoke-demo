*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#111;color:#eee;font-family:"DotGothic16",monospace}

.box{width:100%;max-width:360px;background:#000;border:4px solid #fcfcfc;box-shadow:0 0 0 4px #000,0 0 0 8px #8a1010;padding:28px 22px;text-align:center}

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.i)},key,ub(D.d));
  return new TextDecoder().decode(buf);
}
async function go(pw,remember){
  const html=await open(pw);
  if(remember){try{sessionStorage.setItem('inunoke_pw',pw);}catch(e){}}
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),msg=document.getElementById('msg');
f.addEventListener('submit',async e=>{
  e.preventDefault();msg.style.color='#aaa';msg.textContent='ひらいています…';
  try{await go(document.getElementById('pw').value,true);}
  catch(err){msg.style.color='#f87858';msg.textContent='パスワードが ちがいます';}
});
(async()=>{let s=null;try{s=sessionStorage.getItem('inunoke_pw');}catch(e){}
  if(s){try{await go(s,false);}catch(e){try{sessionStorage.removeItem('inunoke_pw');}catch(_){}}}})();
</script>
